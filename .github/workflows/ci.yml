# Testlerin değeri, birinin elle çalıştırmasına bağlı olmamalı.
# Bu iş akışı üç şeyi doğrular: backend testleri, lint ve frontend build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # README'nin taahhüt ettiği taban sürüm
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Bağımlılıklar
        working-directory: backend
        run: pip install -r requirements.txt

      # Testler SQLite ile koşar (conftest kendi geçici config'ini yazar);
      # ayrı bir veritabanı servisi gerekmez.
      - name: Testler
        working-directory: backend
        run: python -m pytest tests -q

      # Ölü kod / gerçek hata sınıfları. Kural seçimi backend/ruff.toml'da —
      # CI ve yerel çalıştırma aynı kuralları görsün diye komut satırında
      # --select YOK. (Türkçe metinlerdeki "belirsiz unicode" uyarıları ve
      # FastAPI'nin Depends() deseni bilinçli olarak kapsam dışı.)
      - name: Lint (ölü kod)
        working-directory: backend
        run: python -m ruff check app tests scripts migrations

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıklar
        working-directory: frontend
        run: npm ci

      - name: Testler
        working-directory: frontend
        run: npm test

      # Build kırılırsa pano hiç açılmaz — testlerden bağımsız olarak doğrula.
      - name: Build
        working-directory: frontend
        run: npm run build

      # Üretim bağımlılıklarında bilinen açık kalmasın (dev bağımlılıkları
      # build makinesinde kalır, ayrı değerlendirilir).
      - name: Güvenlik denetimi (üretim bağımlılıkları)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
