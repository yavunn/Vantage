app:
  individual_view_enabled: true
  anonymize_individuals: true
  window_days: 30
  bucket_days: 7
database:
  url: sqlite:///./eng_health.db
sync:
  interval_minutes: 60
sources:
  git:
    provider: git_log
    repos:
    - name: nabiz
      path: C:/Users/Asus/Documents/GitHub/Muhendislik-IK-Metrik-Sistemi
      slug: yavunn/Muhendislik-IK-Metrik-Sistemi
      team: People & Engineering Intelligence Platform
    github:
      token_env: GITHUB_TOKEN
      detail_limit: 150
      max_prs: 200
    gitlab:
      base_url: ''
      token_env: GITLAB_TOKEN
      projects: []
  tasks:
    provider: trello
    jira:
      base_url: ''
      token_env: JIRA_TOKEN
      projects: []
    trello:
      key_env: TRELLO_KEY
      token_env: TRELLO_TOKEN
      boards:
      - FMm9Vuzg
    status_mapping:
      backlog:
      - BACKLOG
      - Araştırma Konuları
      - Yapılacaklar
      - staj
      in_progress:
      - DEVELOPMENT
      - TEST
      done:
      - DONE
metrics:
  cycle_time:
    enabled: true
    source: jira_status
    fallback: pr_merge
  pr_review_time:
    enabled: true
  review_latency:
    enabled: true
  deployment_frequency:
    enabled: true
    deploy_signal: merge
  change_failure_rate:
    enabled: true
    hotfix_window_days: 3
  mttr:
    enabled: true
    source: jira_incident
    fallback: git_revert
  wip:
    enabled: true
  rework:
    enabled: true
    window_days: 21
  estimate_accuracy:
    enabled: false
  process_hygiene:
    enabled: true
health_thresholds:
  cycle_time_days:
    green: 3.0
    red: 7.0
  pr_review_time_days:
    green: 2.0
    red: 5.0
  review_latency_days:
    green: 1.0
    red: 4.0
  deployment_frequency:
    green: 3.0
    red: 1.0
  change_failure_rate:
    green: 0.15
    red: 0.3
  mttr_hours:
    green: 24.0
    red: 72.0
  wip_per_dev:
    green: 3.0
    red: 5.0
  rework_rate:
    green: 0.15
    red: 0.35
  process_hygiene:
    green: 0.8
    red: 0.5
  data_completeness_min: 0.5
rules:
  review_bottleneck:
    enabled: true
    avg_review_wait_days: 4.0
  hotspot_files:
    enabled: true
    min_fix_touches: 3.0
    window_days: 30.0
  wip_overload:
    enabled: true
    wip_per_dev: 5.0
  low_process_hygiene:
    enabled: true
    missing_estimate_pct: 70.0
  risky_deploy_window:
    enabled: true
llm:
  enabled: true
  provider: claude
  local:
    base_url: http://localhost:11434
    model: llama3.1
  claude:
    model: claude-sonnet-5
    api_key_env: ANTHROPIC_API_KEY
code_analysis:
  enabled: true
  weights:
    readability: 1.0
    complexity: 1.0
    maintainability: 1.0
    test_adequacy: 1.0
    security: 1.0
    code_smells: 1.0
    conventions: 1.0
  max_files_per_run: 40
  max_diff_lines: 400
survey:
  enabled: true
  interval_days: 14
  min_responses: 4
