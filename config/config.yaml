app:
  individual_view_enabled: true
  anonymize_individuals: false
  window_days: 30
  bucket_days: 7
database:
  url: postgresql+psycopg://health:health@localhost:5433/eng_health
sync:
  interval_minutes: 60
sources:
  git:
    provider: none
    repos: []
    gitlab:
      base_url: ''
      token_env: GITLAB_TOKEN
      projects: []
  tasks:
    provider: trello
    jira:
      base_url: ''
      token_env: JIRA_TOKEN
      projects: []
    trello:
      key_env: TRELLO_KEY
      token_env: TRELLO_TOKEN
      boards:
      - UOIzVeO2
      - rAUYPvr0
  quality:
    provider: none
    sonarqube:
      base_url: ''
      token_env: SONAR_TOKEN
      project_keys: []
    linter:
      command: ruff check --output-format json .
metrics:
  cycle_time:
    enabled: true
    source: jira_status
    fallback: pr_merge
  pr_review_time:
    enabled: true
  review_latency:
    enabled: true
  deployment_frequency:
    enabled: true
    deploy_signal: merge
  change_failure_rate:
    enabled: true
    hotfix_window_days: 3
  mttr:
    enabled: true
    source: jira_incident
    fallback: git_revert
  wip:
    enabled: true
  rework:
    enabled: true
    window_days: 21
  estimate_accuracy:
    enabled: false
  process_hygiene:
    enabled: true
health_thresholds:
  cycle_time_days:
    green: 3
    red: 7
  pr_review_time_days:
    green: 2
    red: 5
  review_latency_days:
    green: 1
    red: 4
  deployment_frequency:
    green: 3
    red: 1
  change_failure_rate:
    green: 0.15
    red: 0.3
  mttr_hours:
    green: 24
    red: 72
  wip_per_dev:
    green: 3
    red: 5
  rework_rate:
    green: 0.15
    red: 0.35
  process_hygiene:
    green: 0.8
    red: 0.5
  data_completeness_min: 0.5
rules:
  review_bottleneck:
    enabled: true
    avg_review_wait_days: 4
  hotspot_files:
    enabled: true
    min_fix_touches: 3
    window_days: 30
  wip_overload:
    enabled: true
    wip_per_dev: 5
  low_process_hygiene:
    enabled: true
    missing_estimate_pct: 70
  risky_deploy_window:
    enabled: true
llm:
  enabled: false
  provider: none
  local:
    base_url: http://localhost:11434
    model: llama3.1
  claude:
    model: claude-sonnet-5
    api_key_env: ANTHROPIC_API_KEY
code_analysis:
  enabled: false
  weights:
    readability: 1.0
    complexity: 1.0
    maintainability: 1.0
    test_adequacy: 1.0
    security: 1.0
    code_smells: 1.0
    conventions: 1.0
  exclude_globs:
  - generated/*
  - vendor/*
  - node_modules/*
  - dist/*
  - build/*
  - '*.min.js'
  - '*.lock'
  - '*.map'
  max_files_per_run: 40
  max_diff_lines: 400
