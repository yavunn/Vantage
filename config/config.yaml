app:
  individual_view_enabled: true
  anonymize_individuals: true
  window_days: 30
  bucket_days: 7
database:
  url: sqlite:///./vantage.db
sync:
  interval_minutes: 60
sources:
  git:
    provider: git_log
    repos:
    - name: vantage
      path: C:/Users/Asus/Documents/GitHub/Muhendislik-IK-Metrik-Sistemi
      slug: yavunn/Muhendislik-IK-Metrik-Sistemi
      team: People & Engineering Intelligence Platform
    github:
      token_env: GITHUB_TOKEN
      detail_limit: 150
      max_prs: 200
    gitlab:
      base_url: ''
      token_env: GITLAB_TOKEN
      projects: []
  tasks:
    provider: trello
    jira:
      base_url: ''
      token_env: JIRA_TOKEN
      projects: []
    trello:
      key_env: TRELLO_KEY
      token_env: TRELLO_TOKEN
      boards:
      - FMm9Vuzg
    status_mapping:
      backlog:
      - BACKLOG
      - Araştırma Konuları
      - Yapılacaklar
      - staj
      in_progress:
      - DEVELOPMENT
      - TEST
      done:
      - DONE
metrics:
  cycle_time:
    enabled: true
    source: jira_status
    fallback: pr_merge
  pr_review_time:
    enabled: true
  review_latency:
    enabled: true
  deployment_frequency:
    enabled: true
    deploy_signal: merge
  change_failure_rate:
    enabled: true
    hotfix_window_days: 3
  mttr:
    enabled: true
    source: jira_incident
    fallback: git_revert
  wip:
    enabled: true
  rework:
    enabled: true
    window_days: 21
  estimate_accuracy:
    enabled: false
  process_hygiene:
    enabled: true
health_thresholds:
  cycle_time_days:
    green: 3.0
    red: 7.0
  pr_review_time_days:
    green: 2.0
    red: 5.0
  review_latency_days:
    green: 1.0
    red: 4.0
  deployment_frequency:
    green: 3.0
    red: 1.0
  change_failure_rate:
    green: 0.15
    red: 0.3
  mttr_hours:
    green: 24.0
    red: 72.0
  wip_per_dev:
    green: 3.0
    red: 5.0
  rework_rate:
    green: 0.15
    red: 0.35
  process_hygiene:
    green: 0.8
    red: 0.5
  data_completeness_min: 0.5
rules:
  review_bottleneck:
    enabled: true
    avg_review_wait_days: 4.0
  hotspot_files:
    enabled: true
    min_fix_touches: 3.0
    window_days: 30.0
  wip_overload:
    enabled: true
    wip_per_dev: 5.0
  low_process_hygiene:
    enabled: true
    missing_estimate_pct: 70.0
  risky_deploy_window:
    enabled: true
llm:
  enabled: true
  provider: local
  local:
    base_url: http://localhost:11434
    # Genel amaçlı model — coder DEĞİL. qwen2.5-coder:7b bir kod modeli;
    # Türkçe bağlamı özetlemede kendi içinde çelişen cevaplar üretiyordu.
    #
    # 7B DEĞİL, 14B. Ölçüldü: qwen2.5:7b iş analizinde sayıyı okuyamıyor
    # ("+1232/-7 satır"ı "12 commit" diye yazdı) ve Türkçe'de var olmayan
    # kelimeler üretiyordu. Prompt iki kez sıkılaştırıldı, düzelmedi — bu
    # 7B'nin Türkçe tavanı, prompt sorunu değil. Modeli küçültürsen aynı
    # bozulmayı geri getirirsin.
    #
    # Kurulum:  ollama pull qwen2.5:14b   (~9 GB)
    model: qwen2.5:14b
  claude:
    model: claude-sonnet-5
    api_key_env: ANTHROPIC_API_KEY
code_analysis:
  enabled: true
  weights:
    readability: 1.0
    complexity: 1.0
    maintainability: 1.0
    test_adequacy: 1.0
    security: 1.0
    code_smells: 1.0
    conventions: 1.0
  max_files_per_run: 40
  max_diff_lines: 400
survey:
  enabled: true
  interval_days: 14
  min_responses: 4
projects:
  local_roots:
  - C:/Users/Asus/Documents/GitHub
  max_local_commits: 100
rag:
  # Açmadan önce: embedding sağlayıcısı ayakta olmalı (Ollama + bge-m3).
  # Kapalıyken /api/teams/{id}/ask ucu 503 döner, senkron indeksleme atlar.
  enabled: true
  embedding:
    provider: local          # local | hash (hash yalnız test içindir)
    base_url: http://localhost:11434
    # bge-m3: çok dilli. Kayıtlar Türkçe; İngilizce ağırlıklı bir model
    # (nomic-embed-text) burada ilgiliyi ilgisizden ayıramıyordu — ölçüldü:
    # ilgili kayıt skorları 0.598-0.751, ilgisizler 0.590-0.653 (çakışıyor).
    model: bge-m3
  chunk:
    words: 400
    overlap: 60
  retrieval:
    # Ölçüm (scripts/rag_eval.py, bge-m3): ilgili kayıt 8 sorunun 8'inde de
    # 1. sırada. 3 = cevabın kendisi + 2 destekleyici kayıt.
    top_k: 3
    # ÖLÇÜM (scripts/rag_eval.py, bge-m3, 2026-08-04, güncel korpus):
    #   ilgili kayıtların en düşük skoru   : 0.5456   (hit@1: 8/8 = %100)
    #   alakasız soruların en yüksek skoru : 0.4885
    # Eşik bu boşluğun ortasında: ilgiliyi kesmiyor, alakasızı geçirmiyor.
    #
    # ÖNCEKİ ölçüm (0.4681 / 0.5134) ile eşik 0.49'du; korpus değiştiği için
    # boşluk kaydı ve 0.49 alakasız banda 0.0015 kalıyordu — yani neredeyse
    # sıfır pay. Korpusu değiştiren iki iş: commit GÖVDELERİNİN indekse
    # girmesi ve kaynakta olmayan kayıtların indeksten çıkarılması.
    #
    # Modeli YA DA korpusu belirgin değiştirirsen bu sayı GEÇERSİZDİR: ölç.
    min_score: 0.517
  index: auto                # auto | memory (pgvector bu kurulumda yok)
